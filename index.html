<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>音樂大作戰🎵</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: "Microsoft JhengHei", "Noto Sans TC", monospace;
      background:
        linear-gradient(rgba(255,255,255,.06), rgba(255,255,255,.06)),
        url("back.png") center center / cover no-repeat;
      image-rendering: pixelated;
      user-select: none;
    }

    button, input {
      font: inherit;
    }

    /* ===== 遊戲主畫面 ===== */
    .game {
      position: relative;
      width: 100%;
      height: 100dvh;
      min-height: 560px;
      overflow: hidden;
    }

    .top-title {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      text-align: center;
      color: #fff;
      text-shadow:
        3px 3px 0 #5d3a74,
        -2px 0 0 #5d3a74,
        0 -2px 0 #5d3a74;
      white-space: nowrap;
    }

    .top-title h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 52px);
      letter-spacing: 3px;
    }

    .stage-text {
      display: inline-block;
      margin-top: 8px;
      padding: 7px 18px;
      color: #fff9c7;
      font-size: clamp(14px, 2vw, 20px);
      font-weight: 900;
      background: rgba(87, 56, 111, .78);
      border: 3px solid #fff;
      box-shadow: 4px 4px 0 rgba(46, 25, 61, .65);
    }

    /* ===== 怪物區 ===== */
    .monster-area {
      position: absolute;
      left: 50%;
      top: 51%;
      transform: translate(-50%, -50%);
      width: min(560px, 70vw);
      height: min(560px, 64vh);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    .hp-panel {
      width: min(430px, 75vw);
      margin-bottom: 18px;
      padding: 10px 12px 12px;
      border: 4px solid #fff;
      background: rgba(49, 31, 65, .86);
      box-shadow:
        5px 5px 0 rgba(33, 18, 43, .55),
        inset 0 0 0 3px rgba(255,255,255,.12);
    }

    .hp-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 7px;
      color: white;
      font-size: clamp(14px, 2vw, 19px);
      font-weight: 900;
      text-shadow: 2px 2px 0 #3f294d;
    }

    .hp-track {
      position: relative;
      width: 100%;
      height: 24px;
      padding: 3px;
      background: #2c2432;
      border: 3px solid #fff;
      overflow: hidden;
    }

    .hp-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff5f8f, #ff9e6d);
      transition: width .35s steps(8, end);
    }

    .monster-wrap {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      flex: 1;
      min-height: 0;
    }

    .monster {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(8px 11px 0 rgba(46, 28, 55, .28));
      transform-origin: center bottom;
    }

    .monster.spawn {
      animation: spawn .42s steps(5, end);
    }

    .monster.hit {
      animation: monsterShake .38s steps(2, end);
    }

    .monster.stage-3 {
      transform: scale(1.5);
    }

    .monster.stage-3.hit {
      animation: monsterShakeBig .38s steps(2, end);
    }

    .damage-pop {
      position: absolute;
      left: 50%;
      top: 18%;
      transform: translate(-50%, 0);
      z-index: 10;
      pointer-events: none;
      color: #fff36b;
      font-size: clamp(34px, 5vw, 62px);
      font-weight: 1000;
      text-shadow:
        4px 4px 0 #d93867,
        -2px -2px 0 #fff;
      opacity: 0;
    }

    .damage-pop.show {
      animation: damageFloat .65s steps(7, end);
    }

    /* ===== 左下：說明 ===== */
    .rule-zone {
      position: absolute;
      left: 26px;
      bottom: 24px;
      z-index: 8;
    }

    .image-button {
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
      transition: transform .08s;
    }

    .image-button:hover {
      transform: scale(1.04);
    }

    .image-button:active {
      transform: translateY(3px) scale(.98);
    }

    #ruleBtn img {
      display: block;
      width: clamp(92px, 10vw, 145px);
      max-height: 100px;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(4px 5px 0 rgba(0,0,0,.22));
    }

    /* ===== 右下：攻擊操作 ===== */
    .attack-zone {
      position: absolute;
      right: 28px;
      bottom: 22px;
      z-index: 8;
      width: clamp(180px, 20vw, 250px);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
    }

    .damage-label {
      color: white;
      font-size: 15px;
      font-weight: 900;
      text-align: center;
      text-shadow: 2px 2px 0 #4d315e;
    }

    #damageInput {
      width: 100%;
      height: 52px;
      border: 4px solid #fff;
      outline: none;
      background: #fff8e9;
      color: #563b67;
      text-align: center;
      font-size: 23px;
      font-weight: 1000;
      box-shadow: 5px 5px 0 rgba(65, 41, 78, .5);
    }

    #damageInput:focus {
      background: #fff;
      box-shadow:
        5px 5px 0 rgba(65, 41, 78, .5),
        0 0 0 4px rgba(255, 225, 111, .75);
    }

    #attackBtn {
      width: 100%;
    }

    #attackBtn img {
      display: block;
      width: 100%;
      max-height: 92px;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(4px 5px 0 rgba(0,0,0,.22));
    }

    #attackBtn:disabled {
      cursor: not-allowed;
      opacity: .45;
      filter: grayscale(.4);
      transform: none;
    }

    .input-hint {
      min-height: 18px;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      text-shadow: 1px 1px 0 #5a3867;
    }

    /* ===== 彈窗共用 ===== */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      place-items: center;
      padding: 22px;
      background: rgba(34, 24, 46, .62);
      backdrop-filter: blur(3px);
    }

    .overlay.show {
      display: grid;
      animation: fadeIn .16s linear;
    }

    .pixel-modal {
      position: relative;
      width: min(560px, 92vw);
      padding: 34px 28px 28px;
      color: #594069;
      text-align: center;
      background: #fff7dc;
      border: 6px solid #fff;
      outline: 5px solid #70517f;
      box-shadow:
        10px 10px 0 rgba(38, 25, 48, .45),
        inset 0 0 0 4px #f4d7ef;
    }

    .pixel-modal h2 {
      margin: 0 0 16px;
      color: #e55083;
      font-size: clamp(25px, 4vw, 38px);
      text-shadow: 2px 2px 0 #fff;
    }

    .pixel-modal p {
      margin: 8px auto;
      max-width: 450px;
      font-size: clamp(16px, 2.2vw, 21px);
      line-height: 1.75;
      font-weight: 900;
    }

    .reward-song {
      margin: 18px auto 12px;
      color: #8c58a0;
      font-size: clamp(21px, 3vw, 30px);
      font-weight: 1000;
    }

    .close-btn {
      position: absolute;
      top: 8px;
      right: 10px;
      width: 38px;
      height: 38px;
      padding: 0;
      border: 4px solid #6d4d79;
      background: #fff;
      color: #6d4d79;
      font-size: 22px;
      font-weight: 1000;
      line-height: 29px;
      cursor: pointer;
      box-shadow: 3px 3px 0 #d8b5db;
    }

    .close-btn:hover {
      background: #ffe5f2;
    }

    /* ===== 規則彈窗：固定 300 x 400 ===== */
    .rule-modal {
      position: relative;
      width: 300px;
      height: 400px;
      max-width: calc(100vw - 30px);
      max-height: calc(100vh - 30px);
      padding: 0;
      background: transparent;
    }

    .rule-image {
      display: block;
      width: 300px;
      height: 400px;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(8px 8px 0 rgba(38, 25, 48, .4));
    }

    .rule-close {
      top: 7px;
      right: 7px;
      z-index: 3;
    }

    /* ===== 通關彈窗 ===== */
    .final-modal {
      background:
        linear-gradient(rgba(255,250,224,.94), rgba(255,250,224,.94));
    }

    .stars {
      font-size: 32px;
      letter-spacing: 8px;
      animation: starPulse .8s steps(2, end) infinite;
    }

    /* ===== 動畫 ===== */
    @keyframes monsterShake {
      0%   { transform: translate(0, 0) rotate(0); }
      15%  { transform: translate(-11px, 2px) rotate(-2deg); }
      30%  { transform: translate(12px, -2px) rotate(2deg); }
      45%  { transform: translate(-9px, 1px) rotate(-2deg); }
      60%  { transform: translate(9px, -1px) rotate(2deg); }
      75%  { transform: translate(-5px, 0) rotate(-1deg); }
      100% { transform: translate(0, 0) rotate(0); }
    }

    @keyframes monsterShakeBig {
      0%   { transform: scale(1.5) translate(0, 0) rotate(0); }
      15%  { transform: scale(1.5) translate(-11px, 2px) rotate(-2deg); }
      30%  { transform: scale(1.5) translate(12px, -2px) rotate(2deg); }
      45%  { transform: scale(1.5) translate(-9px, 1px) rotate(-2deg); }
      60%  { transform: scale(1.5) translate(9px, -1px) rotate(2deg); }
      75%  { transform: scale(1.5) translate(-5px, 0) rotate(-1deg); }
      100% { transform: scale(1.5) translate(0, 0) rotate(0); }
    }

    @keyframes damageFloat {
      0%   { opacity: 0; transform: translate(-50%, 12px) scale(.7); }
      20%  { opacity: 1; transform: translate(-50%, 0) scale(1.2); }
      70%  { opacity: 1; transform: translate(-50%, -42px) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -64px) scale(.85); }
    }

    @keyframes spawn {
      0%   { opacity: 0; transform: scale(.45) translateY(30px); }
      65%  { opacity: 1; transform: scale(1.08) translateY(-4px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes starPulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.08); }
    }

    /* ===== 手機版 ===== */
    @media (max-width: 700px) {
      .top-title {
        top: 14px;
      }

      .monster-area {
        top: 46%;
        width: 82vw;
        height: 52vh;
      }

      .hp-panel {
        margin-bottom: 10px;
      }

      .rule-zone {
        left: 14px;
        bottom: 18px;
      }

      .attack-zone {
        right: 14px;
        bottom: 14px;
        width: min(44vw, 205px);
      }

      #damageInput {
        height: 46px;
        font-size: 20px;
      }
    }
  </style>
</head>

<body>
  <main class="game">
    <header class="top-title">
      <h1>音樂大作戰🎵</h1>
      <div class="stage-text" id="stageText">STAGE 1 / 3</div>
    </header>

    <section class="monster-area">
      <div class="hp-panel">
        <div class="hp-info">
          <span id="monsterName">音符怪物 ①</span>
          <span id="hpText">10 / 10 HP</span>
        </div>
        <div class="hp-track">
          <div class="hp-fill" id="hpFill"></div>
        </div>
      </div>

      <div class="monster-wrap">
        <img class="monster spawn" id="monsterImg" src="1.png" alt="音符怪物">
        <div class="damage-pop" id="damagePop">-1</div>
      </div>
    </section>

    <div class="rule-zone">
      <button class="image-button" id="ruleBtn" type="button" aria-label="遊戲說明">
        <img src="rule.png" alt="說明">
      </button>
    </div>

    <section class="attack-zone">
      <div class="damage-label">輸入本次傷害</div>
      <input
        id="damageInput"
        type="number"
        inputmode="numeric"
        min="1"
        step="1"
        placeholder="傷害數字"
        autocomplete="off"
      >

      <button class="image-button" id="attackBtn" type="button" disabled aria-label="攻擊">
        <img src="atk.png" alt="攻擊">
      </button>

      <div class="input-hint" id="inputHint">請先輸入傷害數字</div>
    </section>
  </main>

  <!-- 傷害說明 -->
  <div class="overlay" id="ruleOverlay">
    <div class="rule-modal">
      <img class="rule-image" src="rule_open.png" alt="遊戲說明">
      <button class="close-btn rule-close" id="closeRule" type="button">×</button>
    </div>
  </div>

  <!-- 第一、二關擊敗獎勵 -->
  <div class="overlay" id="rewardOverlay">
    <div class="pixel-modal">
      <button class="close-btn" id="closeReward" type="button">×</button>
      <h2>擊敗成功！🎉</h2>
      <div class="reward-song">擊敗獎勵歌唱時間🎶</div>
      <p>補滿能量後繼續擊敗更多怪物!</p>
    </div>
  </div>

  <!-- 最終通關 -->
  <div class="overlay" id="finalOverlay">
    <div class="pixel-modal final-modal">
      <button class="close-btn" id="closeFinal" type="button">×</button>
      <div class="stars">✨🎵✨</div>
      <h2>恭喜通關</h2>
      <p>接下來請盡情享受獎勵歌唱時間🎵</p>
    </div>
  </div>

  <script>
    const stages = [
      {
        hp: 10,
        image: "1.png",
        name: "音符怪物 ①"
      },
      {
        hp: 20,
        image: "2.png",
        name: "音符怪物 ②"
      },
      {
        hp: 30,
        image: "3.png",
        name: "音符怪物 ③"
      }
    ];

    let currentStage = 0;
    let currentHp = stages[0].hp;
    let attacking = false;
    let waitingForNextStage = false;

    const stageText = document.getElementById("stageText");
    const monsterName = document.getElementById("monsterName");
    const hpText = document.getElementById("hpText");
    const hpFill = document.getElementById("hpFill");
    const monsterImg = document.getElementById("monsterImg");
    const damagePop = document.getElementById("damagePop");

    const damageInput = document.getElementById("damageInput");
    const attackBtn = document.getElementById("attackBtn");
    const inputHint = document.getElementById("inputHint");

    const ruleOverlay = document.getElementById("ruleOverlay");
    const rewardOverlay = document.getElementById("rewardOverlay");
    const finalOverlay = document.getElementById("finalOverlay");

    const ruleBtn = document.getElementById("ruleBtn");
    const closeRule = document.getElementById("closeRule");
    const closeReward = document.getElementById("closeReward");
    const closeFinal = document.getElementById("closeFinal");

    function refreshStage(withSpawn = false) {
      const stage = stages[currentStage];

      stageText.textContent = `STAGE ${currentStage + 1} / ${stages.length}`;
      monsterName.textContent = stage.name;
      monsterImg.src = stage.image;

      // 第三關怪物顯示為前兩關的 1.5 倍
      monsterImg.classList.toggle("stage-3", currentStage === 2);

      if (withSpawn) {
        monsterImg.classList.remove("spawn");
        void monsterImg.offsetWidth;
        monsterImg.classList.add("spawn");
      }

      updateHp();
    }

    function updateHp() {
      const maxHp = stages[currentStage].hp;
      const percent = Math.max(0, (currentHp / maxHp) * 100);

      hpText.textContent = `${currentHp} / ${maxHp} HP`;
      hpFill.style.width = `${percent}%`;
    }

    function updateAttackState() {
      const value = Number(damageInput.value);
      const valid = Number.isInteger(value) && value > 0;

      attackBtn.disabled = !valid || attacking || waitingForNextStage;

      if (waitingForNextStage) {
        inputHint.textContent = "怪物已擊敗！";
      } else if (!damageInput.value) {
        inputHint.textContent = "請先輸入傷害數字";
      } else if (!valid) {
        inputHint.textContent = "請輸入大於 0 的整數";
      } else {
        inputHint.textContent = `準備造成 ${value} 點傷害！`;
      }
    }

    function playHitAnimation(damage) {
      monsterImg.classList.remove("hit");
      damagePop.classList.remove("show");

      void monsterImg.offsetWidth;

      monsterImg.classList.add("hit");
      damagePop.textContent = `-${damage}`;
      damagePop.classList.add("show");
    }

    function attack() {
      const damage = Number(damageInput.value);

      if (
        attacking ||
        waitingForNextStage ||
        !Number.isInteger(damage) ||
        damage <= 0
      ) {
        return;
      }

      attacking = true;
      attackBtn.disabled = true;

      currentHp = Math.max(0, currentHp - damage);
      playHitAnimation(damage);
      updateHp();

      damageInput.value = "";

      setTimeout(() => {
        attacking = false;

        if (currentHp <= 0) {
          defeatMonster();
        } else {
          updateAttackState();
          damageInput.focus();
        }
      }, 430);
    }

    function defeatMonster() {
      waitingForNextStage = true;
      updateAttackState();

      if (currentStage === stages.length - 1) {
        setTimeout(() => {
          finalOverlay.classList.add("show");
        }, 250);
      } else {
        setTimeout(() => {
          rewardOverlay.classList.add("show");
        }, 250);
      }
    }

    function goToNextStage() {
      rewardOverlay.classList.remove("show");

      if (currentStage >= stages.length - 1) return;

      currentStage++;
      currentHp = stages[currentStage].hp;
      waitingForNextStage = false;

      refreshStage(true);
      updateAttackState();

      setTimeout(() => damageInput.focus(), 350);
    }

    damageInput.addEventListener("input", () => {
      // 防止小數、負數與科學記號造成誤輸入
      if (damageInput.value !== "") {
        const clean = damageInput.value.replace(/[^\d]/g, "");
        damageInput.value = clean;
      }

      updateAttackState();
    });

    damageInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !attackBtn.disabled) {
        attack();
      }
    });

    attackBtn.addEventListener("click", attack);

    ruleBtn.addEventListener("click", () => {
      ruleOverlay.classList.add("show");
    });

    closeRule.addEventListener("click", () => {
      ruleOverlay.classList.remove("show");
    });

    closeReward.addEventListener("click", goToNextStage);

    closeFinal.addEventListener("click", () => {
      finalOverlay.classList.remove("show");
    });

    // 點擊規則彈窗外部也可以關閉
    ruleOverlay.addEventListener("click", (event) => {
      if (event.target === ruleOverlay) {
        ruleOverlay.classList.remove("show");
      }
    });

    // ESC 關閉規則；獎勵視窗必須使用 X 才會進下一關
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && ruleOverlay.classList.contains("show")) {
        ruleOverlay.classList.remove("show");
      }
    });

    refreshStage(true);
    updateAttackState();
  </script>
</body>
</html>
